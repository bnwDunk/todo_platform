name: Deploy to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted]

    steps:
      - name: Deploy
        run: |
          set -e
          cd /home/devops/todo_platform
          git pull origin main
          docker compose up -d --build
          docker compose ps
          docker compose logs --tail=100 backend